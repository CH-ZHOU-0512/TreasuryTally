# Place these locations in the server block that should expose the application.
location = /trust-receipt {
    return 301 /trust-receipt/;
}

location ^~ /trust-receipt/ {
    auth_basic "Trust Receipt";
    auth_basic_user_file /etc/nginx/ssl/trust-receipt.htpasswd;

    proxy_pass http://trust-receipt:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
